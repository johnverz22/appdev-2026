services:

  # ── Service Registry (Eureka Server) ───────────────────────────────────────
  eureka-server:
    image: eclipse-temurin:17-jdk
    container_name: eureka_server
    ports:
      - "8761:8761"
    volumes:
      - ./eureka-server:/app
    working_dir: /app
    command: ./mvnw spring-boot:run

  # ── API Gateway (Spring Cloud Gateway) ────────────────────────────────────
  api-gateway:
    image: eclipse-temurin:17-jdk
    container_name: api_gateway
    depends_on:
      - eureka-server
    ports:
      - "8000:8000"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
    volumes:
      - ./api-gateway:/app
    working_dir: /app
    command: ./mvnw spring-boot:run

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    platform: linux/amd64 # Forces Rosetta emulation if ARM image is missing
    container_name: postgres_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./php/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── Auth service (Spring Boot) ─────────────────────────────────────────────
  sb:
    image: eclipse-temurin:17-jdk
    container_name: springboot_app
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    volumes:
      - ./sb:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: ./mvnw spring-boot:run

  # ── Products API (PHP + Composer) ──────────────────────────────────────────
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=auth_db
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
    volumes:
      - ./php:/var/www/html
      - php_vendor:/var/www/html/vendor

  # ── Checkout service (Django) ──────────────────────────────────────────────
  django:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: django_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=auth_db
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
    volumes:
      - ./django:/app
    command: >
      sh -c "python manage.py makemigrations checkout && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  # ── React frontend ─────────────────────────────────────────────────────────
  react:
    image: node:20-alpine
    container_name: react_front
    depends_on:
      - api-gateway
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_PHP_API_URL=http://localhost:8000
      - VITE_DJANGO_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./react:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
  php_vendor: