# Read DB connection details from environment variables (set in docker-compose.yml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:java_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — validate schema (table already created by init.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Listen on port 8081
server.port=8081

# URL of the PHP Products service (injected via PRODUCT_SERVICE_URL env var)
# Inside Docker Compose, services talk to each other by service name.
product.service.url=${PRODUCT_SERVICE_URL:http://php-service:8000}
