services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432" # Host 5434 -> Container 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data


  # Auth service
  sb:
    # Use a pre-built JDK image instead of building a local Dockerfile
    image: eclipse-temurin:17-jdk-alpine 
    container_name: springboot_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=Zm9ydHktdHdvLWlzLXRoZS1hbnN3ZXItdG8tbGlmZS10aGUtdW5pdmVyc2UtYW5kLWV2ZXJ5dGhpbmc=
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    volumes:
      - ./sb:/app              # Maps your local 'sb' folder to /app in the container
      - ~/.m2:/root/.m2        # Caches Maven dependencies in your WSL home
    working_dir: /app
    # The container starts, sees your files via the volume, and runs them
    command: ./mvnw spring-boot:run


  react:
    image: node:20-alpine
    container_name: react_front
    depends_on:
      - sb
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./react:/app
      - /app/node_modules
    working_dir: /app
    # Install linux-compatible node_modules on startup before running dev server
    command: sh -c "npm install && npm run dev -- --host"  # --- PHP API Service ---

volumes:
  postgres_data: #persist db data


